name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
#      - run: ./gradlew clean test
        env: {JWT_SECRET: 01234567890123456789012345678901}
      - uses: dependency-check/Dependency-Check_Action@main
        with: {project: ProjectManagement, path: '.', format: HTML}
        env:
          # This Docker action needs the JDK path available inside its own image,
          # not the runner path exported by actions/setup-java.
          JAVA_HOME: /opt/jdk
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
