spring.application.name=ProjectManagement
spring.profiles.default=dev
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ProjectManagment}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false

server.port=9090
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:project-management-api}
security.jwt.access-token-ttl=PT15M
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.max-http-form-post-size=1MB
