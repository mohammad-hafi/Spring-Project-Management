spring.application.name=ProjectManagement
spring.profiles.default=dev
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ProjectManagment}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false

server.port=${PORT:${SERVER_PORT:9090}}
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:project-management-api}
security.jwt.access-token-ttl=PT15M
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.max-http-form-post-size=1MB

# Swagger UI is the API's primary interactive surface. Keep its presentation focused and usable.
springdoc.swagger-ui.customCssUrl=/swagger-ui/project-management.css
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true

logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false
management.otlp.metrics.export.enabled=false
management.tracing.sampling.probability=1.0

management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGS_ENDPOINT:http://localhost:5341/ingest/otlp/v1/logs}
